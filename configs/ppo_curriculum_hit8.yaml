# Reward ablation: the baseline diagnosis showed the agent trading hits for damage
# (standing still 87 % of the time; a hit cost only as much as 3 % boss damage).
# Same as ppo_curriculum but a hit costs -8 instead of -3.
name: ppo_curriculum_hit8
algo: ppo
n_envs: 8
torch_threads: 2
total_timesteps: 15_000_000
frame_skip: 4
eval_every: 500_000
reward:
  hit_taken: -8.0
curriculum:
  enabled: true
  adaptive: true
  promote_at: 0.6
