# Round 3: robustness for sim-to-real. Fine-tune the 100 %-win curriculum model on randomized
# physics (timings, speeds, hitboxes jittered +-15 % per episode). Evaluation stays nominal.
name: r3_domain_rand
algo: ppo
n_envs: 8
torch_threads: 2
total_timesteps: 10_000_000   # additional steps on top of the 15M of the init model
frame_skip: 4
randomize: true
randomize_scale: 0.15
eval_every: 500_000
init_from: runs/r2_curriculum_hit3/final.zip
