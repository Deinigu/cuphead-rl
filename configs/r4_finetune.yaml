# Round 4: the simulator now matches the real game (live-track velocities, jump/tomb/EX fixes;
# the round-2 model takes 0.81 hits per sim fight vs 0.80 in the game). Fine-tune the round-3
# domain-randomized model on it, keeping +-15 % physics randomization. Evaluation stays nominal.
name: r4_finetune
algo: ppo
n_envs: 8
torch_threads: 2
total_timesteps: 10_000_000   # additional steps on top of the init model
frame_skip: 4
randomize: true
randomize_scale: 0.15
eval_every: 500_000
init_from: runs/r3_domain_rand/final.zip
