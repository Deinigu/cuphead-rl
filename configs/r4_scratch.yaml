# Round 4: the whole recipe from scratch on the final simulator, for the "learning to beat
# Goopy" footage: reverse curriculum (as r2_curriculum_hit3) plus +-15 % physics randomization.
name: r4_scratch
algo: ppo
n_envs: 8
torch_threads: 2
total_timesteps: 20_000_000
frame_skip: 4
randomize: true
randomize_scale: 0.15
curriculum:
  enabled: true
  adaptive: true
  promote_at: 0.6
  init_stage: 2
eval_every: 500_000
