[project]
name = "cuphead-rl"
version = "0.1.0"
description = "Reinforcement learning agent that beats Goopy Le Grande (Cuphead) - simulator first, then the real game."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "gymnasium>=1.0",
    "torch>=2.4",
    "stable-baselines3>=2.4",
    "sb3-contrib>=2.4",
    "pygame-ce>=2.5",
    "imageio>=2.35",
    "imageio-ffmpeg>=0.5",
    "tensorboard>=2.17",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "rich>=13.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cuphead_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
